  <main class="contenedor">
    <h1>Contacto</h1>
    <div class="contacto">
      <section class="datos">
        <img src="img/mapa.jpg" alt="Mapa de ubicación en Google Maps">
        <h2>Mapa de ubicación</h2>
        <ul>
          <li><img src="img/ico-pin.svg" alt="" class="icono"> Morelos, México</li>
          <li><img src="img/ico-mail.svg" alt="" class="icono"> <a href="mailto:20253ds165@utez.edu.mx">20253ds165@utez.edu.mx</a></li>

        </ul>
        <a href="https://www.google.com/maps" target="_blank" rel="noopener">Abrir en Google Maps</a>
      </section>
      <form class="formulario" action="#" method="post">
        <label for="nombre"><img src="img/ico-user.svg" alt="" class="icono"> Nombre</label>
        <input type="text" id="nombre" name="nombre">
        <label for="correo"><img src="img/ico-mail.svg" alt="" class="icono"> Correo</label>
        <input type="email" id="correo" name="correo">
        <label for="comentarios">Comentarios</label>
        <textarea id="comentarios" name="comentarios" rows="5"></textarea>
        <button type="submit" class="boton-primario">Enviar</button>
      </form>
    </div>

  <footer class="pie">
